# On every push to main: build the executables, publish them as a
# GitHub release, and tell the box to fetch it. No secrets: the job
# mints a short-lived OIDC token that the box's `deploy_trust github
# { … }` block verifies against GitHub's keys.
name: deploy
on:
  push:
    branches: [main]
  # Run workflow → a version from the releases page: the box relaunches
  # that release from its disk (the newest `keep` of them stay), through
  # the same health gate and cutover as a deploy. No build, no release.
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to this version (a tag on the releases page)"
        required: true

permissions:
  contents: write # create the release
  id-token: write # mint the deploy token

concurrency: deploy # one at a time: a second deploy would get a 409

jobs:
  deploy:
    # MUST be the box's architecture: the executable is the runner's
    # Node binary. ubuntu-24.04-arm for an arm64 box, ubuntu-24.04 for
    # amd64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !inputs.rollback }}
        with:
          node-version: 26
      - run: npm run bundle
        if: ${{ !inputs.rollback }}
      - id: version
        if: ${{ !inputs.rollback }}
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ !inputs.rollback }}
        id: release
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: app.tar.gz
      # The asset's API URL, not its public download URL, so a private
      # repo deploys the same way: the box fetches it with this job's own
      # token (which expires with the job), and the box's
      # `artifact_allowlist api.github.com/repos/your-org/` admits it.
      - run: scripts/deploy.sh "$ASSET_URL"
        if: ${{ !inputs.rollback }}
        env:
          HOTSERVE_URL: https://deploy.example.com/example
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_URL: ${{ fromJSON(steps.release.outputs.assets)[0].url }}
          ARTIFACT_AUTH_HEADER: token ${{ github.token }}
      - if: ${{ inputs.rollback }}
        run: scripts/deploy.sh --rollback "$ROLLBACK"
        env:
          HOTSERVE_URL: https://deploy.example.com/example
          ROLLBACK: ${{ inputs.rollback }}
