# On every push to main: build the executables, publish them as a
# GitHub release, and tell the box to fetch it. No secrets: the job
# mints a short-lived OIDC token that the box's `deploy_trust github
# { … }` block verifies against GitHub's keys.
#
# No file here names the box. Its address is the repository variable
# HOTSERVE_URL (Settings → Secrets and variables → Actions →
# Variables), and the runner is the variable HOTSERVE_RUNS_ON when the
# default below is not the one the box needs.
name: deploy
on:
  push:
    branches: [main]
  # Run workflow → a version from the releases page: the box relaunches
  # that release from its disk (the newest `keep` of them stay), through
  # the same health gate and cutover as a deploy. No build, no release.
  # Leave "Use workflow from" on main: the box's deploy_trust pins
  # `claim ref refs/heads/main`, and a run from a tag or branch is a 401.
  workflow_dispatch:
    inputs:
      rollback:
        description: "Roll back to this version (a tag on the releases page)"
        required: true

permissions:
  contents: write # create the release
  id-token: write # mint the deploy token

concurrency: deploy # one at a time: a second deploy would get a 409

jobs:
  deploy:
    # MUST be the box's architecture: the executable is the runner's
    # Node binary. The default is for an arm64 box; for amd64, set the
    # variable HOTSERVE_RUNS_ON to ubuntu-24.04. A mismatch is refused
    # at deploy time, naming the runs-on label to set.
    runs-on: ${{ vars.HOTSERVE_RUNS_ON || 'ubuntu-24.04-arm' }}
    env:
      # The app's webhook on the box, e.g.
      # https://deploy.example.com/example. A repository variable, not
      # an organization one: it names this one app.
      HOTSERVE_URL: ${{ vars.HOTSERVE_URL }}
    steps:
      # A repository made from a template runs this workflow as it is
      # created, before the variable can exist: that run stops here,
      # with the one setting it needs, and publishes nothing.
      - name: Check HOTSERVE_URL is set
        if: ${{ !vars.HOTSERVE_URL }}
        run: |
          echo "::error title=HOTSERVE_URL is not set::Add the repository variable HOTSERVE_URL, the app's webhook on the box (https://deploy.example.com/example, say): Settings → Secrets and variables → Actions → Variables, or gh variable set HOTSERVE_URL -R $GITHUB_REPOSITORY --body <url>. Then push to main."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ !inputs.rollback }}
        with:
          node-version: 26
      - run: npm run bundle
        if: ${{ !inputs.rollback }}
      - id: version
        if: ${{ !inputs.rollback }}
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: ${{ !inputs.rollback }}
        id: release
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: app.tar.gz
      # The asset's API URL, not its public download URL, so a private
      # repo deploys the same way: the box fetches it with this job's own
      # token (which expires with the job), and the box's
      # `artifact_allowlist api.github.com/repos/your-org/` admits it.
      - run: scripts/deploy.sh "$ASSET_URL"
        if: ${{ !inputs.rollback }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_URL: ${{ fromJSON(steps.release.outputs.assets)[0].url }}
          ARTIFACT_AUTH_HEADER: token ${{ github.token }}
      - if: ${{ inputs.rollback }}
        run: scripts/deploy.sh --rollback "$ROLLBACK"
        env:
          ROLLBACK: ${{ inputs.rollback }}
