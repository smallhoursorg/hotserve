# Checks every box's Caddyfile on every push and pull request, with the
# latest stable hotserve release; on a push to main, also sends HEAD to
# each box (bin/apply). A box applies it only if this workflow's token names
# this repository's main, and a key the box lists signed every commit
# since the one it runs. Nothing secret is stored here.
name: apply
on: [push, pull_request]

permissions:
  contents: read

env:
  # Empty: the latest stable release. The repository variable pins one
  # instead (0.3.0, 0.3.0-rc1), for a box held on an older release or a
  # prerelease being tried. Each box validates what it is sent with its
  # own binary whatever this says; this is only the early check.
  HOTSERVE_VERSION: ${{ vars.HOTSERVE_VERSION }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hotserve (the release's bare binary)
        run: |
          v=${HOTSERVE_VERSION#v}
          if [ -z "$v" ]; then
            # Where the latest release's page redirects to: no API call,
            # so no rate limit shared with other jobs on the runner's IP.
            v=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/smallhoursorg/hotserve/releases/latest)
            v=${v##*/v}
          fi
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "not a hotserve release: '$v' (from HOTSERVE_VERSION, or the latest release's tag)" >&2; exit 1; }
          base=https://github.com/smallhoursorg/hotserve/releases/download/v$v
          f=hotserve_${v}_linux_amd64.tar.gz
          curl -fsSLO "$base/$f"
          curl -fsSLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "$f" hotserve
          sudo install -m 0755 hotserve /usr/local/bin/hotserve
          echo "hotserve $v"
      - run: make check

  # Not after check: each box validates what it is sent, and one box's
  # broken file must not hold another box's fix back.
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the token each box's deploy_trust checks
    # One run at a time, never cancelled mid-push. A run waiting behind
    # this one sends its own HEAD, which carries this one's commits.
    concurrency:
      group: apply
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit between the one each box runs and HEAD goes in
          # its bundle.
          fetch-depth: 0
          persist-credentials: false
      # The same step as check's: bin/apply needs it only to read each
      # box's address from its Caddyfile, which any release with `box`
      # reads alike.
      - name: Install hotserve (the release's bare binary)
        run: |
          v=${HOTSERVE_VERSION#v}
          if [ -z "$v" ]; then
            v=$(curl -fsSL -o /dev/null -w '%{url_effective}' https://github.com/smallhoursorg/hotserve/releases/latest)
            v=${v##*/v}
          fi
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] ||
            { echo "not a hotserve release: '$v' (from HOTSERVE_VERSION, or the latest release's tag)" >&2; exit 1; }
          base=https://github.com/smallhoursorg/hotserve/releases/download/v$v
          f=hotserve_${v}_linux_amd64.tar.gz
          curl -fsSLO "$base/$f"
          curl -fsSLO "$base/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar -xzf "$f" hotserve
          sudo install -m 0755 hotserve /usr/local/bin/hotserve
          echo "hotserve $v"
      - run: bin/apply
