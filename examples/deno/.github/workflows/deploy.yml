# On every push to main: build the tarball, publish it as a GitHub
# release, and tell the box to fetch it. No secrets: the job mints a
# short-lived OIDC token that the box's `deploy_trust github { … }`
# block verifies against GitHub's keys.
name: deploy
on:
  push:
    branches: [main]

permissions:
  contents: write # create the release
  id-token: write # mint the deploy token

concurrency: deploy # one at a time: a second deploy would get a 409

jobs:
  deploy:
    # Build on the box's architecture if you add npm packages with
    # native code (ubuntu-24.04-arm for an arm64 box).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .deno-version # the version the box runs
      - run: deno task bundle
      - id: version
        run: echo "version=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        id: release
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: app.tar.gz
      # The asset's API URL, not its public download URL, so a private
      # repo deploys the same way: the box fetches it with this job's own
      # token (which expires with the job), and the box's
      # `artifact_allowlist api.github.com/repos/your-org/` admits it.
      - run: scripts/deploy.sh "$ASSET_URL"
        env:
          HOTSERVE_URL: https://deploy.example.com/example
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_URL: ${{ fromJSON(steps.release.outputs.assets)[0].url }}
          ARTIFACT_AUTH_HEADER: token ${{ github.token }}
