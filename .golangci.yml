# Curated on top of the standard set (errcheck, govet, staticcheck,
# ineffassign, unused):
#   errorlint  — broken %w chains and direct err comparisons
#   gosec      — security antipatterns (this thing runs as root)
#   misspell   — docs and comments are part of the product
#   gocritic   — style + performance diagnostics
#   unconvert  — redundant conversions
#   unparam    — unused function parameters
#   nolintlint — every //nolint must name its linter and carry a reason
#
# No run.build-tags here: each tag set leaves some test files out, so
# `make lint` runs once bare and once with -tags integration instead.
version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - gocritic
    - unconvert
    - unparam
    - nolintlint
  exclusions:
    rules:
      # Tests legitimately use predictable temp paths, lenient perms
      # and unchecked cleanup.
      - path: _test\.go
        linters:
          - gosec
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

# gofmt runs as part of `make lint`, in both of its passes, so a
# formatting drift fails CI rather than waiting for a reviewer to spot it.
formatters:
  enable:
    - gofmt
