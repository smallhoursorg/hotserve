# gitleaks configuration: the default rules, plus one allowlist.
#
# liveswap/testdata/redact/ holds fixtures for the response filter
# (liveswap/redact.go): sample deploy output carrying credential-shaped
# strings on purpose, so the tests can assert they are redacted. None
# is a real secret. The Go tests for the same filter carry a few more
# inline, each marked gitleaks:allow on its line.
#
# The backup env-file parser (backup/backup.go) has the same need: its
# tests feed it a RESTIC_PASSWORD line to prove a value survives an `=`
# sign. That one fixture value is allowlisted by its own text rather
# than by file, so anything else that ever lands in that file is still
# scanned — and by text rather than by a `gitleaks:allow` comment,
# because this scan reads every commit, including the one that
# introduced it.
#
# The backup e2e suite (e2e/backup/run.sh) proves the S3 fixture refuses
# a wrong key, with `curl --user "$S3_KEY_ID:wrong"`: a shell variable
# and the word "wrong", which the curl-auth-user rule reads as a
# credential. Allowlisted by that text, for the same reason.
[extend]
useDefault = true

[allowlist]
description = "fixtures that are credential-shaped by design"
paths = ['''^liveswap/testdata/redact/''']
regexes = ['''secret=with=equals''', '''\$S3_KEY_ID:wrong''']
