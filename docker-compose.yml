services:
  # Go toolchain for unit/integration tests, vet, tidy. The image is the
  # toolchain pin — no Go install needed on the host. Integration tests
  # spawn real child processes (the test app), which is why this service
  # has no read_only hardening: the tests exercise process management.
  dev:
    image: golang:1.26-trixie
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  # The same toolchain with systemd as PID 1, for `make test-integration`:
  # liveswap runs apps as transient units under a real systemd user
  # manager, so the integration suite (the runner's own tests plus the
  # caddytest scenarios that deploy a real app) needs one. Privileged +
  # host cgroup namespace + the cgroup mount is the systemd-in-docker
  # recipe that works on cgroup-v2 hosts (GitHub runners, Docker
  # Desktop). Caches are shared with `dev`.
  dev-systemd:
    build:
      context: test/systemd
    image: hotserve-dev-systemd
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

  lint:
    image: golangci/golangci-lint:v2.12.2
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - golangcicache:/root/.cache/golangci-lint

  # Secret scanner for `make secretscan` and CI's gitleaks job. Lives
  # here — not as a raw `docker run` in the workflow — because
  # Dependabot only parses structured fields (compose image: keys,
  # Dockerfile FROMs, go.mod requires, workflow uses:), never shell
  # strings: an image tag inside a run: line is a pin nothing watches,
  # and a secret scanner's value is its rule set staying current.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    volumes:
      - .:/src

  # Packager for the release .deb/.apk artifacts (`make package`).
  nfpm:
    image: goreleaser/nfpm:v2.47.0
    working_dir: /src
    volumes:
      - .:/src

  # Serves the demo app tarballs (v1, v2, and a broken v3) that the
  # liveswap scenarios deploy through the webhook — standing in for a
  # GitHub or GitLab release asset URL.
  e2e-artifacts:
    build:
      context: e2e/liveswap
      dockerfile: artifacts.Dockerfile

  # The hotserve product binary under test (built from cmd/hotserve).
  # This container plays the production VPS: systemd as PID 1 running
  # the packaged hotserve.service as the hotserve user; it terminates
  # HTTP, receives deploy webhooks, runs the deployed demo app as a
  # transient unit under the hotserve user's systemd manager,
  # rate-limits and caches. Privileged + host cgroup namespace + the
  # cgroup mount is the systemd-in-docker recipe (cgroup-v2 hosts).
  e2e-hotserve:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    image: hotserve-e2e
    privileged: true
    cgroup: host
    stop_signal: SIGRTMIN+3
    tmpfs:
      - /run
      - /run/lock
    # e2e-token.service mints a local deploy keypair + token into the
    # shared volume before hotserve starts (no OIDC provider on the
    # offline compose network); the runner reads the token as its
    # deploy bearer. lib.sh + the systemd suite are for `make e2e`'s
    # in-container step.
    volumes:
      - e2e-deploy:/shared
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      # securityfs from the host: lets the AppArmor profile the package
      # ships be loaded into the host kernel's policy from inside, which
      # is what makes the sandbox work under an Ubuntu kernel's
      # user-namespace restriction (see Makefile install-test).
      - /sys/kernel/security:/sys/kernel/security
      - ./e2e/lib.sh:/lib.sh:ro
      - ./e2e/liveswap/systemd.sh:/suite-systemd.sh:ro
    depends_on:
      - e2e-artifacts
      - e2e-upstream

  # Stub origin for the penaltybox scenarios: echoes the requested hint
  # level back as the response header. Reuses the product image with a
  # different config.
  e2e-upstream:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    image: hotserve-e2e
    command: ["/usr/bin/hotserve", "run", "--config", "/etc/hotserve/Caddyfile"]
    # Plain `hotserve run`, not systemd: the image's SIGRTMIN+3 stop
    # signal would be ignored and cost a 10s SIGKILL wait on teardown.
    stop_signal: SIGTERM
    volumes:
      - ./e2e/penaltybox/upstream.Caddyfile:/etc/hotserve/Caddyfile:ro

  # Runs both scenario suites; its exit code gates `make e2e`. The
  # merged Caddyfile is mounted so the reload scenario can POST it to
  # the admin API mid-traffic.
  e2e-runner:
    image: curlimages/curl:8.21.0
    depends_on:
      - e2e-hotserve
    volumes:
      - ./e2e/run.sh:/run.sh:ro
      - ./e2e/lib.sh:/lib.sh:ro
      - ./e2e/liveswap/run.sh:/suite-liveswap.sh:ro
      - ./e2e/liveswap/recovery.sh:/suite-recovery.sh:ro
      - ./e2e/soak.sh:/soak.sh:ro
      - ./e2e/penaltybox/run.sh:/suite-penaltybox.sh:ro
      - ./e2e/Caddyfile:/Caddyfile:ro
      - e2e-deploy:/shared:ro
    entrypoint: ["/bin/sh", "/run.sh"]

volumes:
  gomodcache:
  gobuildcache:
  golangcicache:
  e2e-deploy:
