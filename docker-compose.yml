services:
  # Go toolchain for unit/integration tests, vet, tidy. The image is the
  # toolchain pin — no Go install needed on the host. Integration tests
  # spawn real child processes (the test app), which is why this service
  # has no read_only hardening: the tests exercise process management.
  dev:
    image: golang:1.26-bookworm
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

  lint:
    image: golangci/golangci-lint:v2.12.2
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build
      - golangcicache:/root/.cache/golangci-lint

  # Packager for the release .deb/.apk artifacts (`make package`).
  nfpm:
    image: goreleaser/nfpm:v2.47.0
    working_dir: /src
    volumes:
      - .:/src

  # Serves the demo app tarballs (v1, v2, and a broken v3) that the
  # liveswap scenarios deploy through the webhook — standing in for a
  # GitHub or GitLab release asset URL.
  e2e-artifacts:
    build:
      context: e2e/liveswap
      dockerfile: artifacts.Dockerfile

  # The hotserve product binary under test (built from cmd/hotserve).
  # This container plays the production VPS: it terminates HTTP,
  # receives deploy webhooks, runs the deployed demo app as its own
  # child processes, rate-limits and caches.
  e2e-hotserve:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    image: hotserve-e2e
    environment:
      LIVESWAP_SECRET: e2e-secret
    depends_on:
      - e2e-artifacts
      - e2e-upstream

  # Stub origin for the penaltybox scenarios: echoes the requested hint
  # level back as the response header. Reuses the product image with a
  # different config.
  e2e-upstream:
    build:
      context: .
      dockerfile: e2e/Dockerfile
    image: hotserve-e2e
    volumes:
      - ./e2e/penaltybox/upstream.Caddyfile:/etc/hotserve/Caddyfile:ro

  # Runs both scenario suites; its exit code gates `make e2e`. The
  # merged Caddyfile is mounted so the reload scenario can POST it to
  # the admin API mid-traffic.
  e2e-runner:
    image: curlimages/curl:8.21.0
    depends_on:
      - e2e-hotserve
    volumes:
      - ./e2e/run.sh:/run.sh:ro
      - ./e2e/liveswap/run.sh:/suite-liveswap.sh:ro
      - ./e2e/liveswap/recovery.sh:/suite-recovery.sh:ro
      - ./e2e/soak.sh:/soak.sh:ro
      - ./e2e/penaltybox/run.sh:/suite-penaltybox.sh:ro
      - ./e2e/Caddyfile:/Caddyfile:ro
    entrypoint: ["/bin/sh", "/run.sh"]

volumes:
  gomodcache:
  gobuildcache:
  golangcicache:
