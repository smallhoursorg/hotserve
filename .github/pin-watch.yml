# pin-watch manifest: every Dependabot *ignore* must have an entry
# here declaring the condition under which the pin should be lifted.
# The pin-watch workflow evaluates these weekly and opens an issue
# when a condition is met — and flags any ignore without a watch (or
# watch without an ignore), so a pin can never rot silently.
#
# Schema per watch:
#   id:          short slug, used in issue titles
#   ignores:     dependency-name exactly as it appears in a
#                dependabot.yml ignore entry
#   reason:      why the pin exists (human context for the issue)
#   unblock:     the machine-checkable exit condition
#     type: upstream-gomod-requires   # the only type implemented so far:
#     repo:        <owner/name>        #   latest release of this repo…
#     module:      <module path>       #   …requires this module…
#     min_version: <vX.Y.Z>            #   …at at least this version
#   action:      what to do when the condition fires

watches: []

# Dependabot alert triage as code: alerts whose GHSA is listed here are
# auto-dismissed by the pin-watch workflow with the given reason and
# comment — so every dismissal is PR-reviewed and its evidence is
# versioned. Alerts NOT listed stay open and notify as normal; this
# section can only silence what a PR has reviewed.
# reason must be one of GitHub's dismissed_reason values:
#   fix_started | inaccurate | no_bandwidth | not_used | tolerable_risk
# Requires the DEPENDABOT_ALERTS_TOKEN secret (fine-grained PAT,
# "Dependabot alerts: read-write" on this repo only) — the Actions
# GITHUB_TOKEN cannot access the Dependabot alerts API.
# Optional `govulncheck: GO-YYYY-NNNN` names the same advisory's Go
# vulndb ID: `make vulncheck` (.github/scripts/vulncheck.sh) then
# tolerates it as called, and FAILS once no module calls it any more
# (fix landed, or the vulndb entry gained symbols we never reach) —
# then the govulncheck key goes; the dismissal stays until its alert
# is gone.

alert_dismissals:
  - ghsa: GHSA-gcjh-h69q-9w9g
    reason: not_used
    # GitHub caps dismissal comments at 280 chars; the full evidence
    # lives here, versioned: the only cel-go consumer in this build is
    # caddy's celmatcher, which registers ext.Strings/Bindings/Lists/
    # Math — ext.NativeTypes (the vulnerable feature) appears nowhere
    # in caddyserver/caddy — and CEL expressions are operator-written
    # config, not request input. This GHSA is not in the Go vulndb, so
    # govulncheck cannot vouch; triaged manually 2026-08-16. Cleared
    # by caddy v2.11.6, which moved to cel.dev/cel-go v0.32 — the old
    # module left every go.sum, so the alert should close on its own;
    # delete this entry once it has.
    comment: >-
      Fixed transitively by caddy v2.11.6, which replaced the vulnerable
      github.com/google/cel-go module with cel.dev/cel-go v0.32. Retaining
      this dismissal only until GitHub closes the existing alert.
  - ghsa: GHSA-w34q-cm8f-9c5x
    reason: not_used
    # otlploggrpc < 0.21 ignores the env TLS certs, bypassing mTLS and
    # pinning. Unreachable: the otel log modules arrive only through
    # caddy's contrib/exporters/autoexport, and caddy calls only
    # autoexport.NewSpanExporter/NewMetricReader — never a log
    # exporter. govulncheck still flags every module because the vulndb
    # entry (published 2026-09-28) is unreviewed and names no symbols,
    # so any import counts as a call. Not bumped alone: otel/log 0.21
    # removed types the 0.19 set uses, and the set moves with
    # autoexport (0.21 needs autoexport >= v0.70; caddy v2.11.4 pins
    # v0.68) — PR #131, closed 2026-09-18. Cleared by caddy v2.11.6
    # (autoexport v0.71, otlploggrpc v0.22): the govulncheck key went
    # with that bump; delete this entry once the alert has closed.
    comment: >-
      Fixed transitively by caddy v2.11.6, which pulls autoexport v0.71
      and otlploggrpc v0.22. Before that it was unreachable: caddy never
      builds a log exporter. Retaining this dismissal only until GitHub
      closes the existing alert.

# Code-scanning (CodeQL) triage as code, same contract as above: alerts
# matching rule + file are auto-dismissed by the pin-watch workflow, so
# the dismissal is PR-reviewed and its evidence versioned. Keyed on
# rule + path (never the alert number — numbers change when refactors
# re-detect the same flow). `expect` caps how many open alerts one
# entry may dismiss: more matches than expected means a NEW flow
# appeared in that file, and the workflow refuses to dismiss and opens
# an issue instead. reason must be one of GitHub's values:
#   false positive | won't fix | used in tests
# Uses the workflow's own GITHUB_TOKEN (security-events: write IS
# grantable, unlike the Dependabot alerts API).

code_scanning_dismissals:
  - rule: go/request-forgery
    path: liveswap/download.go
    expect: 1
    reason: won't fix
    # Permanent by design — the flagged dataflow is the artifact path
    # suffix, which IS payload input: a deploy webhook whose caller
    # cannot name the artifact is not a deploy webhook. What the rule
    # implies (payload steering the request's destination) is closed
    # structurally: scheme constant; host, port and tenant prefix are
    # the allowlist entry's own config bytes (no wildcards); the path
    # suffix passes canonicalEscapedPath (dot segments in any spelling,
    # encoded/doubled slashes, backslashes, overlong UTF-8, control
    # bytes all refused); query parameter names must be entry-declared
    # and query bytes RFC 3986-only; userinfo/fragment structurally
    # absent; https enforced per redirect hop. All of it re-enforced
    # inside pinnedURLString independently of the matcher, and fuzzed
    # with reparse invariants. CodeQL cannot see this because its
    # path-position sanitizer requires a compile-time-constant host,
    # and a config-driven host is the feature. Full trace reviewed
    # 2026-08-17 (PR #19). Revisit if liveswap/download.go grows a
    # second request site (expect: 1 will refuse and open an issue).
    comment: >-
      Accepted by design: the flow is the artifact path suffix inside a
      config-pinned tenant. Host/port/prefix are allowlist config bytes
      (pinnedURLString); suffix and query are gated by
      canonicalEscapedPath/vetQuery, builder-enforced and fuzzed.
      Evidence: .github/pin-watch.yml
