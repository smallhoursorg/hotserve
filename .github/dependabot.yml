# Hands-off dependency updates. The design, together with
# workflows/dependabot-automerge.yml:
#
#   - Weekly grouped PRs (one per ecosystem, not one per dep) so there
#     is never a backlog to triage.
#   - A 7-day cooldown on routine version bumps: compromised upstream
#     releases are almost always yanked within days, so waiting is the
#     cheapest supply-chain defense there is. The gomod clock starts at
#     the module proxy's Time, the tagged commit's date, not the GitHub
#     release's publication: a tag on an old commit gets a short
#     cooldown or none, and no default-days can close that. Security
#     updates BYPASS the cooldown and arrive immediately; gomod's are
#     grouped across its directories too (go-security below).
#   - Patch/minor updates auto-merge once the full CI graph (tests,
#     e2e, package install matrix, govulncheck) passes; majors stay
#     open for human review.
#
# GitHub-side switches this file cannot set (do once, in repo
# Settings): "Allow auto-merge"; a branch ruleset on main requiring
# the "ci-ok" status check; Dependabot alerts + security updates.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/box", "/liveswap", "/penaltybox"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-deps:
        patterns: ["*"]
      # Security updates are grouped across the same directories (a
      # group takes one applies-to, hence two groups). Ungrouped, each
      # would be a one-directory PR, and the root module replaces the
      # other three modules with their local directories: a bump in only
      # one of those can leave the root go.mod untidy, which ci.yml's
      # tidy-check fails.
      go-security:
        applies-to: security-updates
        patterns: ["*"]
    # A Dependabot `ignore` here MUST have a matching watch declaring
    # its exit condition in .github/pin-watch.yml — the pin-watch
    # workflow opens an issue when the condition is met, and flags any
    # ignore without a watch.

  - package-ecosystem: github-actions
    # The examples' deploy workflows are SHA-pinned like ours and are
    # copied into other people's repos, so their pins are kept fresh.
    directories: ["/", "/examples/deno", "/examples/node"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base images (e2e builder/runtime, artifacts server,
  # install-test systemd image, integration-test systemd image).
  - package-ecosystem: docker
    directories: ["/e2e", "/e2e/liveswap", "/packaging/test", "/test/systemd"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dockerfiles:
        patterns: ["*"]

  # Image pins in docker-compose.yml (golang toolchain, golangci-lint,
  # nfpm, curl). If your GitHub instance predates docker-compose
  # support in Dependabot, delete this block and bump those four pins
  # by hand now and then.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ["*"]
