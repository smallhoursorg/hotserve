# Every job runs the same Makefile/compose targets as local development —
# no Go toolchain on the runner; the container images are the pin.
# Also callable as a reusable workflow: release.yml gates publishing on
# this entire graph passing for the tagged commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

env:
  # Adds the CI override that bind-mounts Go caches under ./.cache so
  # actions/cache can persist them.
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: lint-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: lint-${{ runner.os }}-
      - run: make lint COMPOSE="$COMPOSE"

  # Unit + integration on both architectures: arm64 is a first-class
  # deploy target (cheap ARM VPSes), and the race detector plus the
  # process-management integration tests are the deepest arch-specific
  # coverage we have.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - run: make vet COMPOSE="$COMPOSE"
      - run: make test COMPOSE="$COMPOSE"
      - run: make test-integration COMPOSE="$COMPOSE"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: vuln-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: vuln-${{ runner.os }}-
      - run: make vulncheck COMPOSE="$COMPOSE"

  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: e2e (${{ matrix.runner }})
    needs: [test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # make e2e dumps hotserve/upstream/artifact logs itself when
      # scenarios fail.
      - run: make e2e COMPOSE="$COMPOSE"

  # Builds the same .deb/.apk artifacts a release would, on every
  # commit, and hands them to the install-test matrix below.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + tags for version-stamp parity with release.
          fetch-depth: 0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache
          key: pkg-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: pkg-${{ runner.os }}-
      - run: make build COMPOSE="$COMPOSE"
      - run: make package COMPOSE="$COMPOSE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Installs the .deb under real systemd, full distro x arch product,
  # and runs the staged smoke test (install → unit boot → liveswap
  # deploy under the sandbox → reinstall/conffile → remove). The single
  # dist artifact carries both arches; smoke.sh picks by
  # `dpkg --print-architecture`, which is what makes the arm cells work
  # unchanged.
  install-test:
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: install-test (${{ matrix.distro }}, ${{ matrix.runner }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - run: make install-test DISTRO=${{ matrix.distro }}

  # Aggregate gate: the ONE status check to mark required in the main
  # branch ruleset (auto-merge and humans alike wait on it). If any
  # needed job fails or is skipped, this job never runs and the check
  # stays unsatisfied — listing individual matrix cells as required
  # checks is not needed and would rot when cells change.
  ci-ok:
    needs: [lint, test, govulncheck, e2e, package, install-test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all CI jobs green"
