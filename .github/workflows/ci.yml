# Every job runs the same Makefile/compose targets as local development —
# no Go toolchain on the runner; the container images are the pin.
# Also callable as a reusable workflow: release.yml gates publishing on
# this entire graph passing for the tagged commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least-privilege token for every job: the graph only ever reads the
# repo (checkout, caches, artifacts use the runtime token, not this
# one). Jobs that need more must say so at job level.
permissions:
  contents: read

env:
  # Adds the CI override that bind-mounts Go caches under ./.cache so
  # actions/cache can persist them.
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml
  # The JavaScript actions (cache, artifacts, dependency-review,
  # fetch-metadata) verify TLS against the root list their Node
  # bundles, which the floor step cannot reach: this puts them on the
  # system store that step keeps current. Replaces the bundled list,
  # where --use-system-ca only adds to it. SSL_CERT_FILE because where
  # a Node build's OpenSSL looks by default is that build's choice.
  # The test job's ca-trust step proves both hold on the runner.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  # One cell per module: the golangci runs share no state, so
  # they parallelize cleanly (serial they were the slowest lane). Cache
  # keys are per-module so each cell restores exactly its own objects.
  lint:
    strategy:
      fail-fast: false
      matrix:
        module: [".", "backups", "box", "liveswap", "penaltybox"]
    runs-on: ubuntu-latest
    name: lint (${{ matrix.module }})
    steps:
      # Before checkout: git, gh and dockerd's pulls on the runner read
      # the system store, and the runner images can trail the distro's
      # fix for a distrusted CA by weeks. floor is the oldest
      # ca-certificates the jobs accept; when a CA is distrusted, raise
      # it in every copy (each job in every workflow), say why here, and
      # add the root to DISTRUSTED in .github/actions/ca-trust/main.js.
      # At or above it the step touches no apt and cannot fail; below
      # it, it upgrades, restarts dockerd (which reads the store once),
      # and fails the job if the mirror has nothing new enough.
      # 20260816 (USN-8944-1): drops "emSign ECC Root CA - G3", which
      # cross-signed the eMudhra intermediates whose keys leaked
      # (CVE-2026-111943, actions/runner-images#15018). The containers
      # need nothing: Debian's 20250419+deb13u1 dropped the same root.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-${{ matrix.module }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: lint-${{ matrix.module }}-${{ runner.os }}-
      # Here, not in test: per module and in parallel like lint, and
      # once (test runs per arch; tidy considers every platform anyway).
      - run: make tidy-check COMPOSE="$COMPOSE" MODULES="${{ matrix.module }}"
      # Even after a tidy-check failure, so one run shows both.
      - if: ${{ !cancelled() }}
        run: make lint COMPOSE="$COMPOSE" MODULES="${{ matrix.module }}"

  # Unit + integration on both architectures: arm64 is a first-class
  # deploy target (cheap ARM VPSes), and the race detector plus the
  # process-management integration tests are the deepest arch-specific
  # coverage we have.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.runner }})
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # Both fixes above, proved on this arch's runner image: no distrusted
      # root in the system store, and the JavaScript actions on that store
      # rather than their Node's bundled list (.github/actions/ca-trust).
      - uses: ./.github/actions/ca-trust
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - run: make vet COMPOSE="$COMPOSE"
      - run: make test COMPOSE="$COMPOSE"
      # Deterministic half of fuzzing: every Fuzz target is discovered
      # (so the weekly run cannot skip one) and every committed crasher
      # corpus still has a target to replay it.
      - run: make fuzz-list COMPOSE="$COMPOSE"
      - run: make test-integration COMPOSE="$COMPOSE"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: vuln-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: vuln-${{ runner.os }}-
      - run: make vulncheck COMPOSE="$COMPOSE"

  # No needs: e2e shares no artifacts or caches with test (it builds
  # its own compose stack from source), so it runs in parallel — on
  # green runs that removes the whole test->e2e serial leg from the
  # critical path. The trade: a red unit test now burns (free) e2e
  # minutes alongside, and peak arm-runner demand is higher — if
  # arm cells start sitting in "queued", restoring `needs: [test]`
  # here is the first lever.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: e2e (${{ matrix.runner }})
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # Debian 13 does not restrict unprivileged user namespaces, but
      # GitHub's runners boot an *Ubuntu* kernel, which refuses them to
      # unconfined processes host-wide — and the sysctl is not
      # namespaced, so it reaches into the container. The package used
      # to ship an AppArmor profile to lift it; with the matrix down to
      # Debian 13 that profile is gone, so the runner is brought in line
      # with a real Debian host instead. Consequence to keep in view: CI
      # no longer exercises a userns-restricted kernel, and the runtime
      # probe (liveswap/sandbox.go) is what refuses to start on such a
      # host rather than running apps with no sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # make e2e dumps hotserve/upstream/artifact logs itself when
      # scenarios fail.
      - run: make e2e COMPOSE="$COMPOSE"

  # The backup suite: its own stack (a box with Debian's restic and
  # sqlite3, and an S3 server), so its own job — run beside e2e it costs
  # its own length plus a build, not a longer critical path. The same
  # sysctl as e2e sets, so that the two boxes are the same host; not
  # measured to be needed here, where the namespaces are made by PID 1.
  # A time limit, because nothing in a backup has one: a wedged restic
  # would otherwise run to the job's six hours.
  e2e-backup:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: e2e-backup (${{ matrix.runner }})
    timeout-minutes: 30
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      # The box's binaries are built in the dev container, whose Go
      # caches are ./.cache here: per arch, since a build cache is.
      # Keyed by the Go they are built with and by go.sum, not by
      # commit: a cache is saved only when its key missed, and one saved
      # per commit (~540 MB an arch) filled the repository's 10 GB and
      # pushed every other job's out. One left by an older commit costs
      # little: Go's build cache is keyed by content, so only what
      # changed is compiled again [measured: 0.9 s over all of PR 5's
      # changes, against 34.5 s from nothing]. One left by another Go is
      # no build cache at all, and the dev image follows Go's patch
      # releases: so its Go is in the key, and no cache of another Go is
      # restored — its build half (721 MiB of 1.7 GiB unpacked) would be
      # saved again, unused, under the new Go's key. A new Go starts
      # cold, once an arch. The Go is asked of plain `docker compose`,
      # the base file alone, and never of $COMPOSE: the CI file's
      # ./.cache bind sources, made now, would be root's, and the
      # restore below could not unpack into them.
      - id: go
        run: echo "version=$(docker compose run --rm -T --no-deps dev go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            e2e-backup-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.version }}-
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make e2e-backup COMPOSE="$COMPOSE"

  # Builds the same .deb artifacts a release would, on every
  # commit, and hands them to the install-test matrix below.
  package:
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for version-stamp parity with release.
          fetch-depth: 0
      - uses: ./.github/actions/runner-sample
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: pkg-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: pkg-${{ runner.os }}-
      - run: make build COMPOSE="$COMPOSE"
      - run: make package COMPOSE="$COMPOSE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Installs the .deb under real systemd on each arch and runs the
  # staged smoke test (install → unit boot → liveswap deploy under the
  # sandbox → reinstall/starter config → remove). The single
  # dist artifact carries both arches; smoke.sh picks by
  # `dpkg --print-architecture`, which is what makes the arm cells work
  # unchanged.
  install-test:
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:13"]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: install-test (${{ matrix.distro }}, ${{ matrix.runner }})
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Debian 13 does not restrict unprivileged user namespaces, but
      # GitHub's runners boot an *Ubuntu* kernel, which refuses them to
      # unconfined processes host-wide — and the sysctl is not
      # namespaced, so it reaches into the container. The package used
      # to ship an AppArmor profile to lift it; with the matrix down to
      # Debian 13 that profile is gone, so the runner is brought in line
      # with a real Debian host instead. Consequence to keep in view: CI
      # no longer exercises a userns-restricted kernel, and the runtime
      # probe (liveswap/sandbox.go) is what refuses to start on such a
      # host rather than running apps with no sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make install-test DISTRO=${{ matrix.distro }}

  # Full-history secret scan: catches keys/tokens in the changes being
  # merged AND anything already buried in history before it ships.
  # Runs via make + compose like every other job — the image pin lives
  # in docker-compose.yml where Dependabot's compose-images group bumps
  # it (a tag inside a raw `docker run` here would be a pin nothing
  # watches, and a secret scanner's value is its rule set staying
  # current).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/runner-sample
      - run: make secretscan COMPOSE="$COMPOSE"

  # PR-only: fails when a PR introduces dependencies with known vulns
  # (or surprise licenses). Deliberately NOT in ci-ok's needs — it is
  # skipped on push/workflow_call events, and a skipped need would leave
  # ci-ok permanently unsatisfied there. To make it merge-blocking, add
  # "dependency-review" as a second required check in the main ruleset
  # (it always runs on PRs, so it can never wedge the gate). Needs the
  # dependency graph: public repo or GHAS.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Aggregate gate: the ONE status check to mark required in the main
  # branch ruleset (auto-merge and humans alike wait on it). It runs
  # UNCONDITIONALLY (if: always()) and asserts every needed job
  # succeeded, so a broken graph produces an explicit red ci-ok —
  # never a missing check. (The previous design let ci-ok silently
  # not run when a need failed; PR #4 auto-merged through exactly
  # that gap and broke main.) Listing individual matrix cells as
  # required checks is still not needed and would rot when cells
  # change.
  # The usage ledger's merge rule has its tests, and its page must match
  # its CSVs: the same drift gate tidy-check is for go.mod. Also the one
  # lane that runs the python image pin. No transcripts, no token:
  # render reads committed files.
  usage-check:
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - run: make usage-check COMPOSE="$COMPOSE"

  ci-ok:
    if: always()
    needs: [lint, test, govulncheck, e2e, e2e-backup, package, install-test, gitleaks, usage-check]
    runs-on: ubuntu-latest
    steps:
      - name: assert every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success")) | if length == 0 then "all CI jobs green" else error("failed: \(map(.key) | join(", "))") end'
