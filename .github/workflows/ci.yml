# Every job runs the same Makefile/compose targets as local development —
# no Go toolchain on the runner; the container images are the pin.
# Also callable as a reusable workflow: release.yml gates publishing on
# this entire graph passing for the tagged commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Least-privilege token for every job: the graph only ever reads the
# repo (checkout, caches, artifacts use the runtime token, not this
# one). Jobs that need more must say so at job level.
permissions:
  contents: read

env:
  # Adds the CI override that bind-mounts Go caches under ./.cache so
  # actions/cache can persist them.
  COMPOSE: docker compose -f docker-compose.yml -f docker-compose.ci.yml

jobs:
  # One cell per module: the three golangci runs share no state, so
  # they parallelize cleanly (serial they were the slowest lane). Cache
  # keys are per-module so each cell restores exactly its own objects.
  lint:
    strategy:
      fail-fast: false
      matrix:
        module: [".", "liveswap", "penaltybox"]
    runs-on: ubuntu-latest
    name: lint (${{ matrix.module }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: lint-${{ matrix.module }}-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: lint-${{ matrix.module }}-${{ runner.os }}-
      - run: make lint COMPOSE="$COMPOSE" MODULES="${{ matrix.module }}"

  # Unit + integration on both architectures: arm64 is a first-class
  # deploy target (cheap ARM VPSes), and the race detector plus the
  # process-management integration tests are the deepest arch-specific
  # coverage we have.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: test (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: test-${{ runner.os }}-${{ runner.arch }}-
      - run: make vet COMPOSE="$COMPOSE"
      - run: make test COMPOSE="$COMPOSE"
      # Deterministic half of fuzzing: every Fuzz target is discovered
      # (so the weekly run cannot skip one) and every committed crasher
      # corpus still has a target to replay it.
      - run: make fuzz-list COMPOSE="$COMPOSE"
      - run: make test-integration COMPOSE="$COMPOSE"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: vuln-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: vuln-${{ runner.os }}-
      - run: make vulncheck COMPOSE="$COMPOSE"

  # No needs: e2e shares no artifacts or caches with test (it builds
  # its own compose stack from source), so it runs in parallel — on
  # green runs that removes the whole test->e2e serial leg from the
  # critical path. The trade: a red unit test now burns (free) e2e
  # minutes alongside, and peak arm-runner demand is higher — if
  # arm cells start sitting in "queued", restoring `needs: [test]`
  # here is the first lever.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: e2e (${{ matrix.runner }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Debian 13 does not restrict unprivileged user namespaces, but
      # GitHub's runners boot an *Ubuntu* kernel, which refuses them to
      # unconfined processes host-wide — and the sysctl is not
      # namespaced, so it reaches into the container. The package used
      # to ship an AppArmor profile to lift it; with the matrix down to
      # Debian 13 that profile is gone, so the runner is brought in line
      # with a real Debian host instead. Consequence to keep in view: CI
      # no longer exercises a userns-restricted kernel, and the runtime
      # probe (liveswap/sandbox.go) is what refuses to start on such a
      # host rather than running apps with no sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # make e2e dumps hotserve/upstream/artifact logs itself when
      # scenarios fail.
      - run: make e2e COMPOSE="$COMPOSE"

  # Builds the same .deb/.apk artifacts a release would, on every
  # commit, and hands them to the install-test matrix below.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for version-stamp parity with release.
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: pkg-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: pkg-${{ runner.os }}-
      - run: make build COMPOSE="$COMPOSE"
      - run: make package COMPOSE="$COMPOSE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Installs the .deb under real systemd on each arch and runs the
  # staged smoke test (install → unit boot → liveswap deploy under the
  # sandbox → reinstall/conffile → remove). The single
  # dist artifact carries both arches; smoke.sh picks by
  # `dpkg --print-architecture`, which is what makes the arm cells work
  # unchanged.
  install-test:
    needs: [package]
    strategy:
      fail-fast: false
      matrix:
        distro: ["debian:13"]
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    name: install-test (${{ matrix.distro }}, ${{ matrix.runner }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      # Debian 13 does not restrict unprivileged user namespaces, but
      # GitHub's runners boot an *Ubuntu* kernel, which refuses them to
      # unconfined processes host-wide — and the sysctl is not
      # namespaced, so it reaches into the container. The package used
      # to ship an AppArmor profile to lift it; with the matrix down to
      # Debian 13 that profile is gone, so the runner is brought in line
      # with a real Debian host instead. Consequence to keep in view: CI
      # no longer exercises a userns-restricted kernel, and the runtime
      # probe (liveswap/sandbox.go) is what refuses to start on such a
      # host rather than running apps with no sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: make install-test DISTRO=${{ matrix.distro }}

  # Full-history secret scan: catches keys/tokens in the changes being
  # merged AND anything already buried in history before it ships.
  # Runs via make + compose like every other job — the image pin lives
  # in docker-compose.yml where Dependabot's compose-images group bumps
  # it (a tag inside a raw `docker run` here would be a pin nothing
  # watches, and a secret scanner's value is its rule set staying
  # current).
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make secretscan COMPOSE="$COMPOSE"

  # PR-only: fails when a PR introduces dependencies with known vulns
  # (or surprise licenses). Deliberately NOT in ci-ok's needs — it is
  # skipped on push/workflow_call events, and a skipped need would leave
  # ci-ok permanently unsatisfied there. To make it merge-blocking, add
  # "dependency-review" as a second required check in the main ruleset
  # (it always runs on PRs, so it can never wedge the gate). Needs the
  # dependency graph: public repo or GHAS.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # Aggregate gate: the ONE status check to mark required in the main
  # branch ruleset (auto-merge and humans alike wait on it). It runs
  # UNCONDITIONALLY (if: always()) and asserts every needed job
  # succeeded, so a broken graph produces an explicit red ci-ok —
  # never a missing check. (The previous design let ci-ok silently
  # not run when a need failed; PR #4 auto-merged through exactly
  # that gap and broke main.) Listing individual matrix cells as
  # required checks is still not needed and would rot when cells
  # change.
  ci-ok:
    if: always()
    needs: [lint, test, govulncheck, e2e, package, install-test, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: assert every needed job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e 'to_entries | map(select(.value.result != "success")) | if length == 0 then "all CI jobs green" else error("failed: \(map(.key) | join(", "))") end'
