# Watches every pin for its declared exit condition. Dependabot covers
# versions it can see; this covers the exceptions: the dependencies we
# tell Dependabot to ignore, and the pseudo-version pins held in go.mod
# (a require ahead of the last tag). Each must carry a machine-checkable
# unblock condition in .github/pin-watch.yml. The script also flags
# drift between that manifest and dependabot.yml (ignores) or the
# workspace go.mods (held pins), and dismisses the Dependabot and
# code-scanning alerts the manifest has reviewed.
# Findings become labeled issues (not red runs — quiet-repo crons that
# fail red get ignored; issues land in notifications and stay open).
name: pin-watch

on:
  schedule:
    - cron: "29 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # For code_scanning_dismissals: unlike the Dependabot alerts API,
  # the code-scanning API IS reachable with the workflow token.
  security-events: write

env:
  # Node actions on the system store; see ci.yml's env.
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  pin-watch:
    runs-on: ubuntu-latest
    steps:
      # Before checkout; floor and why: ci.yml's lint job.
      - name: CA certificates at least the pinned floor
        run: |
          floor=20260816
          v=$(dpkg-query -W -f='${Version}' ca-certificates)
          if ! dpkg --compare-versions "$v" ge "$floor"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --only-upgrade ca-certificates
            sudo systemctl try-restart docker
            v=$(dpkg-query -W -f='${Version}' ca-certificates)
            dpkg --compare-versions "$v" ge "$floor" || { echo "ca-certificates $v is below $floor" >&2; exit 1; }
          fi
          echo "ca-certificates $v"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/runner-sample
      - run: python3 .github/scripts/pin-watch.py
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PIN_WATCH_CREATE_ISSUES: "1"
          # Fine-grained PAT, "Dependabot alerts: read-write" on this
          # repo only — GITHUB_TOKEN cannot access the alerts API.
          # Absent, alert reconciliation degrades to a setup-issue.
          DEPENDABOT_ALERTS_TOKEN: ${{ secrets.DEPENDABOT_ALERTS_TOKEN }}
