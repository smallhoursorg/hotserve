# Product releases: push a tag like v0.1.0 and this builds the binaries
# and OS packages and attaches them to the GitHub release.
# (Submodule tags like liveswap/v0.1.0 do not match the v* filter.)
name: release

on:
  push:
    tags: ['v*']

# Least-privilege default; the release job alone elevates to
# contents: write at job level (see its comment).
permissions:
  contents: read

jobs:
  # The full CI graph (lint, tests, e2e, install-test matrix) must pass
  # on the tagged commit before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    # The write token is scoped to this job only: the CI jobs above run
    # with read permissions, and publishing uses the preinstalled gh CLI
    # rather than third-party action code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the build stamps the version from VCS.
          fetch-depth: 0
      - run: make build
      - run: make package VERSION="${GITHUB_REF_NAME#v}"
      - run: |
          cp build/hotserve-linux-* dist/
          # GitHub mangles "~" in asset filenames to "." — so rename
          # prerelease packages (0.0.1~rc1 -> 0.0.1.rc1) BEFORE
          # checksumming, or checksums.txt records names that do not
          # match what GitHub serves and sha256sum -c fails. Filename
          # only: the version inside the package metadata keeps the
          # dpkg-correct ~rc1 (which sorts BEFORE the real release —
          # that is where apt actually reads it). "." is what GitHub
          # would render anyway; never "_", which is the deb filename
          # field separator.
          for f in dist/*~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done
          cd dist && sha256sum -- * > checksums.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        # A semver prerelease tag (anything with a hyphen: v0.1.0-rc1)
        # must not become "Latest" on the releases page.
        run: |
          args=()
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag "${args[@]}"
