# Product releases: push a tag like v0.1.0 and this builds the binaries
# and OS packages and attaches them to the GitHub release, then brings
# the example apps' template repositories up to it.
# (Submodule tags like liveswap/v0.1.0 do not match the v* filter.)
name: release

on:
  push:
    tags: ['v*']

# Least-privilege default; the release job alone elevates to
# contents: write at job level (see its comment).
permissions:
  contents: read

jobs:
  # The full CI graph (lint, tests, e2e, install-test matrix) must pass
  # on the tagged commit before anything is published.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    # The write token is scoped to this job only: the CI jobs above run
    # with read permissions, and publishing uses the preinstalled gh CLI
    # rather than third-party action code.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the build stamps the version from VCS.
          fetch-depth: 0
      - run: make build
      - run: make package VERSION="${GITHUB_REF_NAME#v}"
      # Raw binaries ship as per-arch tar.gz (binary + LICENSE + a
      # README saying what the packages would have done for you):
      # Apache-2.0 redistribution should carry the license text, the
      # compressed download is a third the size, and the shape matches
      # what Caddy itself ships.
      - run: |
          for arch in amd64 arm64; do
            staging=$(mktemp -d)
            cp "build/hotserve-linux-$arch" "$staging/hotserve"
            cp LICENSE "$staging/LICENSE"
            cat > "$staging/README.txt" <<'EOF'
          hotserve — raw binary distribution
          ==================================

          This archive contains the bare hotserve executable. It is for
          systemd hosts where you manage the service yourself — a
          NixOS-style distro, say.

          systemd is not optional: liveswap runs your apps as transient
          units on the service user's own systemd manager, and there is
          no fallback runner. Without one, hotserve still serves, but a
          Caddyfile defining any app refuses to start.

          If you are on Debian 13, use the .deb from the same release
          instead — it installs everything below for you and is what the
          test matrix certifies. Other systemd distributions can use
          this archive, but nothing else is tested, and a host that
          cannot deliver the per-app sandbox refuses to start — every
          app runs in one, and there is no setting that runs without.
          Many container and LXC hosts cannot deliver it.

          What the package would have set up, and you now own:
            - a dedicated system user/group (hotserve) to run as
            - a systemd unit (Type=notify) running:
                hotserve run --config /etc/hotserve/Caddyfile
              with XDG_DATA_HOME/XDG_CONFIG_HOME pointed somewhere the
              service user can write (TLS certificates live there)
            - libpam-systemd installed, and:
                loginctl enable-linger hotserve
              so that user's systemd manager exists without a login —
              your apps run as units under it, so without this they
              cannot start at all
            - a starter config at /etc/hotserve/Caddyfile

          Docs: https://github.com/smallhoursorg/hotserve
          EOF
            chmod 0755 "$staging/hotserve"
            tar -czf "dist/hotserve_${GITHUB_REF_NAME#v}_linux_${arch}.tar.gz" \
              -C "$staging" hotserve LICENSE README.txt
          done
          # GitHub mangles "~" in asset filenames to "." — so rename
          # prerelease packages (0.0.1~rc1 -> 0.0.1.rc1) BEFORE
          # checksumming, or checksums.txt records names that do not
          # match what GitHub serves and sha256sum -c fails. Filename
          # only: the version inside the package metadata keeps the
          # dpkg-correct ~rc1 (which sorts BEFORE the real release —
          # that is where apt actually reads it). "." is what GitHub
          # would render anyway; never "_", which is the deb filename
          # field separator.
          for f in dist/*~*; do [ -e "$f" ] && mv "$f" "${f//\~/.}"; done
          cd dist && sha256sum -- * > checksums.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        # A semver prerelease tag (anything with a hyphen: v0.1.0-rc1)
        # must not become "Latest" on the releases page.
        run: |
          args=()
          case "$GITHUB_REF_NAME" in *-*) args+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag "${args[@]}"

  # Each example app is also a template repository of its own
  # (smallhoursorg/hotserve-example-node, -deno), for "Use this
  # template". This repo stays the source: once the release is out,
  # each mirror's main becomes exactly what examples/<runtime> holds at
  # this tag, the tree the ci job's e2e deployed, and gains the tag.
  # Prereleases leave the mirrors alone, and so does a tag that is not
  # the newest release (a fix to an older line): the script has the
  # details. A failure here leaves the mirrors one release behind and
  # the release published; "Re-run failed jobs" redoes only this.
  #
  # Set up once, by hand:
  #   - Both repositories, public and created empty; then for each:
  #       gh repo edit <repo> --template --enable-issues=false \
  #         --enable-wiki=false --enable-projects=false \
  #         --description "Template: generated from smallhoursorg/hotserve examples/<runtime> on each release; changes go there"
  #       gh api -X PUT repos/<repo>/actions/permissions -F enabled=false
  #     Actions off, or each sync runs the example's own deploy
  #     workflow in the mirror (with no HOTSERVE_URL there it only
  #     fails at its first step, but off is quieter). A repository
  #     made from the template has Actions on: settings are not copied.
  #     Pull requests off too, in the web UI (Settings → General →
  #     Features; the API has no switch for it): the next release
  #     overwrites whatever one merges.
  #   - TEMPLATES_TOKEN: a fine-grained PAT, resource owner
  #     smallhoursorg, on the two mirror repositories only, with
  #     Contents and Workflows read-write: every sync pushes
  #     .github/workflows/deploy.yml, which a token without Workflows
  #     cannot (and GITHUB_TOKEN never can). Deploy keys are off for
  #     the organization. It expires; renew it before then, or the next
  #     release is red here.
  templates:
    needs: [release]
    if: ${{ !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [node, deno]
    runs-on: ubuntu-latest
    name: templates (${{ matrix.runtime }})
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag: the script publishes only the newest release.
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ secrets.TEMPLATES_TOKEN }}
          RUNTIME: ${{ matrix.runtime }}
        run: sh .github/scripts/publish-template.sh "$RUNTIME" "$GITHUB_REF_NAME"
