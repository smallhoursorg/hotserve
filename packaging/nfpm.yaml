# nfpm packaging definition — currently .deb only, run once
# per arch × format by `make package`. Env: NFPM_ARCH, NFPM_VERSION.
#
# No .apk: Alpine runs OpenRC, so the shipped systemd unit would be
# inert there — a package that installs but starts nothing. The .apk
# returns with an OpenRC script and an Alpine install-test lane in the
# hosted APT/APK repository phase; Alpine users take the raw-binary
# tarball path meanwhile (documented in the README).
name: hotserve
arch: "${NFPM_ARCH}"
platform: linux
version: "${NFPM_VERSION}"
section: web
priority: optional
maintainer: "Hot Sauce Team <davey@web-shed.com>"
description: |
  hotserve — the Hot Sauce server, powered by Caddy.
  Zero-downtime app deploys (liveswap), rate-limit hint enforcement
  (penaltybox) and HTTP caching (Souin + Otter) in one binary.
vendor: Hot Sauce Team
homepage: https://github.com/smallhoursorg/hotserve
license: Apache-2.0

# liveswap runs deployed apps as transient units under the hotserve
# user's systemd manager (user@<uid>.service). pam_systemd is what
# gives that manager its runtime directory; without libpam-systemd it
# cannot start at all. dbus: loginctl (lingering) needs the system bus.
depends:
  # No systemd version floor: the runner works on 252+ (Debian 12,
  # Ubuntu 24.04), and the per-app sandbox is probe-gated at runtime
  # into two tiers (full on 256+, filesystem below) rather than at
  # install (DESIGN-threat-model.md, "The shared-UID rule"). No
  # apparmor dependency either: the shipped profile only matters on
  # hosts that restrict user namespaces (Ubuntu), where apparmor is
  # already installed.
  - libpam-systemd
  - dbus

# Every entry pins its mode. Without file_info nfpm copies the mode of
# the file on the build host, so the package would carry whatever the
# builder's umask happened to be — `make package` under umask 0002
# shipped /usr/bin/hotserve group-writable (0775). A permission that
# arrives by accident is one nobody reviewed.
contents:
  # `make package` stages the right arch's binary at this fixed path
  # before each nfpm run (nfpm does not env-expand contents paths).
  - src: build/hotserve
    dst: /usr/bin/hotserve
    file_info:
      mode: 0755
  - src: packaging/hotserve.service
    dst: /lib/systemd/system/hotserve.service
    file_info:
      mode: 0644
  - src: packaging/Caddyfile
    dst: /etc/hotserve/Caddyfile
    type: config|noreplace
    file_info:
      mode: 0644
  # Grants `userns` to the hotserve user's systemd manager, which the
  # app sandbox needs and Ubuntu 24.04+ otherwise refuses to unconfined
  # processes. Shipped here, NOT in /etc/apparmor.d: postinstall copies
  # it there only where the host's parser accepts it (the `userns` rule
  # needs AppArmor 4; Debian 12's 3.x parser rejects the file, and
  # apparmor.service parses that whole directory at every boot — an
  # unconditional install would break policy loading on a distro that
  # does not even need the profile).
  - src: packaging/apparmor/hotserve-user-manager
    dst: /usr/share/hotserve/apparmor/hotserve-user-manager
    file_info:
      mode: 0644
  # The wrapper the profile attaches to; user@<uid>.service for the
  # hotserve user is started through it (postinstall drop-in).
  # NOT world-executable: the AppArmor profile attaches to this path,
  # so anyone able to execute it would enter a profile granting
  # `userns` and get back the unprivileged user namespaces Ubuntu
  # restricts host-wide. Shipped 0750 root:root and regrouped to
  # hotserve by postinstall, once that group exists — dpkg unpacks
  # before the account is created.
  - src: packaging/user-manager.sh
    dst: /usr/libexec/hotserve/user-manager
    file_info:
      mode: 0750
  - dst: /var/lib/hotserve
    type: dir
    file_info:
      mode: 0750
  - dst: /var/lib/liveswap
    type: dir
    file_info:
      mode: 0750

scripts:
  postinstall: packaging/postinstall.sh
  preremove: packaging/preremove.sh
