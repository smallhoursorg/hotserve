# e2e drop-in for the packaged hotserve unit: the deploy token must
# exist before hotserve reads its Caddyfile (which trusts the public
# half). Everything else — User=hotserve, the sandboxing, the
# user@<uid> drop-in postinstall would write — is the production unit
# verbatim, so the suites run against what ships.
[Unit]
Wants=e2e-token.service
After=e2e-token.service
